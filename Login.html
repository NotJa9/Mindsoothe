<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
    <link rel="stylesheet" href="Login.css" />
    <style>
      .form-container form {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .form-container input {
        width: 80%; /* Adjust width to fit the form */
        margin: 3px 0; /* Add some space between fields */
      }
    </style>
  </head>
  <body>
    <div class="container" id="container">
      <div class="form-container sign-in-container">
        <form action="register.php" method="post">
          <!-- LOgin -->
          <h1>Sign in</h1>
          <input
            type="text"
            name="email"
            id="email"
            placeholder="Email"
            required
          />
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
            required
          />
          <a href="forgot_password.html">Forgot your password?</a>
          <input type="submit" class="Login" value="Sign In" name="signIn" />
          <input
            type="button"
            class="Login"
            value="Back"
            onclick="window.location.href='landingpage.php'"
          />
        </form>
      </div>
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>Welcome Back!</h1>
            <p>
              To keep connected with us please login with your personal info
            </p>
            <button class="ghost" id="signIn">Sign In</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h2>Welcome to</h2>
            <h1>Mindsoothe!</h1>
            <p>Your path to mental wellness starts here.</p>
            <a
              href="#"
              id="googleSignInOverlay"
              class="google-btn"
              style="display: inline-flex; align-items: center; gap: 4px"
            >
              <img
                src="https://developers.google.com/identity/images/g-logo.png"
                alt="Google logo"
                style="height: 18px; width: 18x"
              />
              Continue with Google (Student)
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        fetch("generate_google_auth_url.php")
          .then((response) => response.text())
          .then((url) => {
            // Update both Google buttons with the auth URL
            const googleBtns = document.querySelectorAll(
              "#googleSignIn, #googleSignInOverlay"
            );
            googleBtns.forEach((btn) => {
              if (btn) {
                btn.href = url;
              }
            });
          })
          .catch((error) =>
            console.error("Error fetching Google Auth URL:", error)
          );
      });
    </script>

    <script src="Login.js"></script>
  </body>
</html>
